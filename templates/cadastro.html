{% extends "base.html" %}

{% block title %}Criar Conta - IFSCORE{% endblock %}

{% block content %}
<div class="form-card">
    <div class="form-header">
        <h2>Cadastre-se</h2>
        <p>Cadastre-se para acompanhar tudo sobre seu esporte favorito</p>
    </div>
    
    <form action="/cadastro" method="POST" class="form-body">
        <div class="form-group">
            <label class="form-label">Nome:</label>
            <div class="input-relative">
                <span class="input-icon">
                    <i class="fa-solid fa-user" style="font-size: 12px;"></i>
                </span>
                <input type="text" name="nome" required placeholder="Seu nome completo" class="form-input">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Email:</label>
            <div class="input-relative">
                <span class="input-icon">
                    <i class="fa-solid fa-envelope" style="font-size: 12px;"></i>
                </span>
                <input type="email" name="email" required placeholder="seu@email.com" class="form-input">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Senha:</label>
            <div class="input-relative">
                <span class="input-icon">
                    <i class="fa-solid fa-lock" style="font-size: 12px;"></i>
                </span>
                <input type="password" name="senha" required placeholder="Sua senha secreta" class="form-input">
            </div>
        </div>

        <button type="submit" class="btn-submit">Cadastrar</button>

        <hr class="form-divider">
        
        <p class="form-footer-text">
            Já tem uma conta? <a href="/login-page">Faça login aqui</a>
        </p>
    </form>
</div>
{% endblock %}
