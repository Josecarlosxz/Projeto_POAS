{% extends "base.html" %}

{% block title %}Acessar o Sistema - IFSCORE{% endblock %}

{% block content %}
<div class="form-card">
    <div class="form-header">
        <h2>Login</h2>
        <p>Insira seus dados para entrar na comunidade</p>
    </div>
    
    <form action="/login" method="POST" class="form-body">
        <div class="form-group">
            <label class="form-label">Email:</label>
            <div class="input-relative">
                <span class="input-icon">
                    <i class="fa-solid fa-envelope" style="font-size: 12px;"></i>
                </span>
                <input type="email" name="email" required placeholder="seu@email.com" class="form-input">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Senha:</label>
            <div class="input-relative">
                <span class="input-icon">
                    <i class="fa-solid fa-lock" style="font-size: 12px;"></i>
                </span>
                <input type="password" name="senha" required placeholder="••••••••" class="form-input">
            </div>
        </div>

        <button type="submit" class="btn-submit">Entrar</button>

        <hr class="form-divider">

        <p class="form-footer-text">
            Não tem uma conta? <a href="/cadastro-page">Cadastre-se aqui</a>
        </p>
    </form>
</div>
{% endblock %}
